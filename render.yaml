services:
  - type: worker
    name: one-shelf-price-checker
    runtime: node
    buildCommand: npm install --omit=dev
    startCommand: npm run worker
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: KEEPA_API_KEY
        sync: false
      - key: RAINFOREST_API_KEY
        sync: false
      - key: TRACK_INTERVAL_MS
        value: "21600000"
